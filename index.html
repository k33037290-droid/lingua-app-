<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FoxyLingua</title>
<script src="lessons.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#131f24;color:#fff;padding:12px 12px 80px}
.top{display:flex;justify-content:space-between;padding:8px;border-bottom:2px solid #37464f;font-weight:800;margin-bottom:12px}
.scr{display:none}.scr.act{display:block}
.card{background:#202f36;border:2px solid #37464f;border-radius:14px;padding:12px;margin-bottom:10px}
.btn{width:100%;background:#202f36;color:#fff;border:2px solid #37464f;border-radius:12px;padding:12px;font-size:15px;font-weight:700;text-align:left;margin-bottom:8px}
.bg{background:#58cc02;border:none;text-align:center}.by{background:#ffc800;color:#131f24;border:none;text-align:center}
.node{width:70px;height:70px;border-radius:50%;border:none;background:#58cc02;color:#fff;font-size:24px;font-weight:800;margin:8px auto;display:block}
.node.lock{background:#263740;color:#566973}
.nav{position:fixed;bottom:0;left:0;right:0;height:58px;background:#131f24;border-top:2px solid #37464f;display:flex}
.nav button{flex:1;background:none;border:none;color:#fff;font-weight:800}
</style>
</head>
<body>
<div class="top">
  <span id="hlvl">A1</span>
  <span>🍖 <b id="hfull">100</b>%</span>
  <span>⚡ <b id="hxp">0</b></span>
  <span>❤️ <b id="hhp">5</b></span>
</div>

<div id="s-test" class="scr act">
  <h3 style="margin-bottom:10px">🎯 Тест на уровень (<span id="tstep">1/4</span>)</h3>
  <div class="card" id="tq">1. Переведи: 'They are my friends'</div>
  <div id="topts">
    <button class="btn" onclick="pickT(0)">1. Они мои друзья</button>
    <button class="btn" onclick="pickT(1)">2. Он мой брат</button>
    <button class="btn" onclick="pickT(2)">3. Мы на работе</button>
  </div>
</div>

<div id="s-path" class="scr">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <span>🦊 Сытость: <b id="fstat">100%</b> (🍓 <b id="hfood">2</b>)</span>
    <button class="btn by" style="width:auto;margin:0;padding:8px 12px" onclick="feed()">🍖 Покормить</button>
  </div>
  <div id="chain"></div>
</div>

<div id="s-lesson" class="scr">
  <button class="btn" style="width:auto" onclick="goChain()">✕ Выйти</button>
  <div class="card" id="qtxt">Вопрос</div>
  <div id="qopts"></div>
</div>

<div id="s-rank" class="scr">
  <button class="btn bg" onclick="pvp()">⚔️ Батл 1 на 1 (+30 XP)</button>
  <div id="rlist"></div>
  <div id="phist"></div>
</div>

<div id="s-shop" class="scr">
  <div class="card"><b>👑 Super VIP (50 ⭐️)</b><button class="btn by" style="margin-top:8px" onclick="buy('vip')">КУПИТЬ VIP</button></div>
  <div class="card"><b>🍓 Еда +5 шт. (60 XP)</b><button class="btn bg" style="margin-top:8px" onclick="buyFood()">КУПИТЬ ЕДУ</button></div>
</div>

<div class="nav">
  <button onclick="tab('path')">🏠 Тропа</button>
  <button onclick="tab('rank')">🏆 Лига</button>
  <button onclick="tab('shop')">🛒 Магазин</button>
</div>

<script>
var xp=0,hp=5,vip=false,lvl='',full=100,food=2,prog={},hist=[],ti=0,ts=0,cu=0,cs=0,qi=0;
var tQs=[
  {q:"1. Переведи: 'They are my friends'",o:["1. Они мои друзья","2. Он мой брат","3. Мы на работе"],a:0,p:1},
  {q:"2. Вставь: 'She ___ to school'",o:["1. go","2. goes","3. going"],a:1,p:2},
  {q:"3. 'Я живу здесь с 2020'?",o:["1. I live since 2020","2. I have lived here since 2020"],a:1,p:3},
  {q:"4. 'If I ___ you, I would go'",o:["1. am","2. was","3. were"],a:2,p:4}
];
function save(){try{localStorage.setItem('fx_ok',JSON.stringify({xp:xp,hp:hp,vip:vip,lvl:lvl,full:full,food:food,prog:prog,hist:hist}));}catch(e){}}
function upd(){document.getElementById('hxp').innerText=xp;document.getElementById('hhp').innerText=vip?'♾️':hp;document.getElementById('hfull').innerText=full;document.getElementById('fstat').innerText=full+'%';document.getElementById('hfood').innerText=food;}
function show(id){var s=document.querySelectorAll('.scr');for(var i=0;i<s.length;i++)s[i].classList.remove('act');document.getElementById(id).classList.add('act');}
function pickT(x){if(x===tQs[ti].a)ts+=tQs[ti].p;ti++;if(ti<tQs.length){document.getElementById('tstep').innerText=(ti+1)+'/4';document.getElementById('tq').innerText=tQs[ti].q;var b=document.getElementById('topts');b.innerHTML='';for(var i=0;i<tQs[ti].o.length;i++)b.innerHTML+='<button class="btn" onclick="pickT('+i+')">'+tQs[ti].o[i]+'</button>';}else{lvl=ts>=8?'B2':(ts>=5?'B1':(ts>=2?'A2':'A1'));document.getElementById('hlvl').innerText=lvl;save();goChain();}}
function feed(){if(food<=0){alert('Нет еды!');return;}food--;full=Math.min(100,full+35);upd();save();}
function buyFood(){if(xp<60){alert('Нужно 60 XP');return;}xp-=60;food+=5;upd();save();alert('+5 еды!');}
function goChain(){show('s-path');upd();var c=document.getElementById('chain');c.innerHTML='';if(typeof UNITS==='undefined')return;for(var u=0;u<UNITS.length;u++){var U=UNITS[u];c.innerHTML+='<div class="card"><b>'+U.title+'</b></div>';for(var s=0;s<U.steps.length;s++){var st=U.steps[s],k=U.id+'_'+s,dn=(prog[k]||0)>=(st.stepsTotal||1);c.innerHTML+='<button class="node" onclick="openSt('+u+','+s+')">'+(st.type==='chest'?'🎁':(dn?'⭐':'🦊'))+'</button>';}}}
function openSt(u,s){var st=UNITS[u].steps[s],k=UNITS[u].id+'_'+s;if(UNITS[u].vip&&!vip){alert('Нужен VIP!');return;}if(st.type==='chest'){if(prog[k]){alert('Уже открыт');return;}prog[k]=1;xp+=40;food+=3;upd();save();alert('+40 XP и +3 еды!');goChain();return;}cu=u;cs=s;qi=0;show('s-lesson');rQ();}
function rQ(){var q=UNITS[cu].steps[cs].qs[qi];document.getElementById('qtxt').innerText=q.q;var b=document.getElementById('qopts');b.innerHTML='';if(q.t==='b'){b.innerHTML='<button class="btn bg" onclick="ans(true)">Собрать: '+q.ans.join(' ')+'</button>';}else{for(var i=0;i<q.o.length;i++)b.innerHTML+='<button class="btn" onclick="ans('+(i===q.a)+')">'+q.o[i]+'</button>';}}
function ans(ok){if(ok)xp+=15;else if(!vip)hp=Math.max(0,hp-1);qi++;if(qi<UNITS[cu].steps[cs].qs.length)rQ();else{var k=UNITS[cu].id+'_'+cs;prog[k]=(prog[k]||0)+1;full=Math.max(0,full-20);xp+=25;save();alert('Урок пройден! +25 XP');goChain();}upd();}
function pvp(){var win=Math.random()>0.4;xp=Math.max(0,xp+(win?30:-15));hist.unshift((win?'🏆 Победа +30 XP':'💀 Поражение -15 XP'));upd();save();tab('rank');}
function tab(t){if(t==='path')goChain();else{show('s-'+t);if(t==='rank'){document.getElementById('rlist').innerHTML='<div class="card">🥇 Alex_Pro — 2450 XP</div><div class="card" style="border-color:#1cb0f6">🦊 Ты — '+xp+' XP</div>';document.getElementById('phist').innerHTML='<h4>📜 История боёв</h4>'+hist.map(function(x){return '<div class="card">'+x+'</div>';}).join('');}}}
function buy(it){window.location.href=(it==='vip')?'https://t.me';}
try{var d=JSON.parse(localStorage.getItem('fx_ok'));if(d){xp=d.xp||0;hp=d.hp||5;vip=!!d.vip;lvl=d.lvl||'';full=d.full||100;food=d.food||2;prog=d.prog||{};hist=d.hist||[];upd();if(lvl)goChain();}}catch(e){}
</script>
</body>
</html>
