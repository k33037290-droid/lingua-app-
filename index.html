<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FoxyLingua — Учи английский играя</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg: #131f24;
            --surface: #202f36;
            --border: #37464f;
            --green: #58cc02;
            --green-dark: #46a302;
            --blue: #1cb0f6;
            --blue-dark: #1899d6;
            --gold: #ffc800;
            --gold-dark: #e5a500;
            --orange: #ff9600;
            --red: #ff4b4b;
            --red-dark: #d33131;
            --text: #ffffff;
            --muted: #afafaf;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 2px solid var(--border); background: var(--bg); z-index: 20; font-weight: 800; font-size: 15px; }
        .top-item { display: flex; align-items: center; gap: 6px; }
        .lvl-pill { background: var(--blue); color: #fff; padding: 4px 10px; border-radius: 10px; font-size: 13px; box-shadow: 0 2px 0 var(--blue-dark); }

        .main { flex: 1; overflow-y: auto; padding: 16px 16px 95px; }
        .screen { display: none; }
        .screen.active { display: block; }

        .section-card { background: var(--surface); border: 2px solid var(--border); border-bottom-width: 5px; border-radius: 20px; padding: 18px; margin-bottom: 14px; transition: transform 0.08s; }
        .section-card:active { transform: translateY(3px); border-bottom-width: 2px; }
        .section-card.vip-card { border-color: #634d14; }
        .section-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .pill { display: inline-block; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 9px; text-transform: uppercase; letter-spacing: 0.5px; }
        .pill-free { background: rgba(88, 204, 2, 0.18); color: var(--green); }
        .pill-vip { background: rgba(255, 200, 0, 0.18); color: var(--gold); }
        .sec-title { font-size: 18px; font-weight: 800; margin-bottom: 5px; }
        .sec-desc { font-size: 13px; color: var(--muted); line-height: 1.4; }

        .unit-banner { background: var(--green); color: #fff; padding: 16px 18px; border-radius: 18px; box-shadow: 0 5px 0 var(--green-dark); margin-bottom: 26px; display: flex; justify-content: space-between; align-items: center; }
        .unit-banner.gold-banner { background: var(--gold); color: #131f24; box-shadow: 0 5px 0 var(--gold-dark); }
        .trail { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 6px 0 30px; }
        .step-node { display: flex; flex-direction: column; align-items: center; }
        .circle-btn { width: 78px; height: 72px; border-radius: 50%; border: none; font-size: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.08s; }
        .circle-btn:active { transform: translateY(4px); }
        .circle-btn.is-done { background: var(--gold); color: #131f24; box-shadow: 0 6px 0 var(--gold-dark); }
        .circle-btn.is-active { background: var(--green); color: #fff; box-shadow: 0 6px 0 var(--green-dark); }
        .circle-btn.is-locked { background: #263740; color: #566973; box-shadow: 0 6px 0 #1b282f; }
        .step-tag { margin-top: 8px; background: var(--surface); border: 2px solid var(--border); padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 800; color: #e5e5e5; }

        .lesson-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .close-x { background: none; border: none; color: var(--muted); font-size: 22px; font-weight: 800; }
        .bar-track { flex: 1; height: 16px; background: #263740; border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; width: 10%; background: var(--green); border-radius: 10px; transition: width 0.3s ease; }

        .task-heading { font-size: 20px; font-weight: 800; margin-bottom: 16px; }
        .mascot-row { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
        .foxy-avatar { font-size: 56px; flex-shrink: 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.45)); }
        .speech-bubble { background: var(--surface); border: 2px solid var(--border); border-radius: 18px; padding: 14px 16px; flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 17px; font-weight: 700; line-height: 1.35; }
        .speaker-btn { background: var(--blue); border: none; border-radius: 12px; width: 42px; height: 42px; font-size: 19px; color: #fff; box-shadow: 0 3px 0 var(--blue-dark); flex-shrink: 0; }
        .speaker-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--blue-dark); }

        .choice-btn { width: 100%; background: var(--surface); color: var(--text); border: 2px solid var(--border); border-bottom-width: 5px; border-radius: 16px; padding: 14px 16px; font-size: 16px; font-weight: 700; text-align: left; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
        .choice-btn:active { transform: translateY(3px); border-bottom-width: 2px; }
        .choice-num { width: 28px; height: 28px; border: 2px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); flex-shrink: 0; }
        .choice-btn.right { background: rgba(88, 204, 2, 0.16); border-color: var(--green); color: var(--green); }
        .choice-btn.wrong { background: rgba(255, 75, 75, 0.16); border-color: var(--red); color: var(--red); }

        .slots-line { min-height: 56px; border-bottom: 2px solid var(--border); padding: 6px 2px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
        .tiles-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .tile { background: var(--surface); color: #fff; border: 2px solid var(--border); border-bottom-width: 4px; border-radius: 14px; padding: 10px 14px; font-size: 16px; font-weight: 700; }
        .tile.hidden-tile { background: #1a272d; color: transparent; border-color: #263740; pointer-events: none; }

        .bottom-sheet { position: fixed; bottom: 0; left: 0; right: 0; padding: 20px 18px 24px; z-index: 100; display: none; flex-direction: column; gap: 12px; border-top: 2px solid var(--border); }
        .bottom-sheet.show { display: flex; }
        .bottom-sheet.ok-sheet { background: #183114; border-color: #2b5423; color: var(--green); }
        .bottom-sheet.err-sheet { background: #361616; border-color: #5c2323; color: var(--red); }
        .sheet-head { font-size: 20px; font-weight: 800; }
        .sheet-sub { font-size: 14px; font-weight: 700; }

        .duo-btn { width: 100%; padding: 15px; border: none; border-radius: 16px; font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; }
        .duo-green { background: var(--green); color: #fff; box-shadow: 0 4px 0 var(--green-dark); }
        .duo-red { background: var(--red); color: #fff; box-shadow: 0 4px 0 var(--red-dark); }

        .row-card { background: var(--surface); border: 2px solid var(--border); border-bottom-width: 4px; border-radius: 18px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .star-price { background: var(--gold); color: #131f24; border: none; border-radius: 12px; padding: 10px 14px; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 var(--gold-dark); white-space: nowrap; }

        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 68px; background: var(--bg); border-top: 2px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 40; }
        .tab-btn { background: none; border: 2px solid transparent; border-radius: 14px; padding: 6px 14px; color: var(--muted); font-size: 11px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .tab-btn.active { color: var(--blue); background: rgba(28, 176, 246, 0.12); border-color: rgba(28, 176, 246, 0.35); }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-item"><span class="lvl-pill" id="hdr-lvl">A1</span></div>
        <div class="top-item" style="color:var(--orange)">🔥 <span>1</span></div>
        <div class="top-item" style="color:var(--gold)">⚡ <span id="hdr-xp">0</span></div>
        <div class="top-item" style="color:var(--red)">❤️ <span id="hdr-hp">5</span></div>
    </div>

    <div class="main">
        <div id="scr-test" class="screen active">
            <div style="color:var(--blue);font-size:12px;font-weight:800;margin-bottom:6px;">🎯 ТЕСТ НА УРОВЕНЬ (<span id="t-step">1/5</span>)</div>
            <div class="task-heading">Ответь на 5 вопросов, чтобы Фокси определил твой уровень:</div>
            <div class="mascot-row">
                <div class="foxy-avatar">🦊</div>
                <div class="speech-bubble"><div id="t-q">1. Переведи: 'They are my friends'</div></div>
            </div>
            <div id="t-opts">
                <button type="button" class="choice-btn" onclick="pickTest(0)"><span class="choice-num">1</span>Они мои друзья</button>
                <button type="button" class="choice-btn" onclick="pickTest(1)"><span class="choice-num">2</span>Он мой брат</button>
