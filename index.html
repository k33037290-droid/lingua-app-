<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LinguaPro — Учи английский как в игре</title>
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #131f24; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 2px solid #37464f; font-weight: 800; font-size: 15px; background: #131f24; z-index: 20; }
        .badge-lvl { background: #1cb0f6; color: #fff; padding: 4px 10px; border-radius: 10px; font-size: 13px; }
        
        .content { flex: 1; padding: 16px; overflow-y: auto; padding-bottom: 85px; }
        .tab { display: none; }
        .tab.active { display: block; }

        .course-card { background: #1f2f37; border: 2px solid #37464f; border-bottom-width: 5px; border-radius: 18px; padding: 16px; margin-bottom: 12px; transition: 0.1s; }
        .course-card:active { transform: translateY(2px); border-bottom-width: 3px; }
        .course-card.locked { border-color: #5c4918; }
        .course-card.recommended { border-color: #1cb0f6; }
        .course-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .course-tag { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 8px; text-transform: uppercase; }
        .tag-free { background: #1e3b17; color: #58cc02; }
        .tag-vip { background: #3d2e0a; color: #ffc800; }
        .tag-rec { background: #15384c; color: #1cb0f6; margin-left: 6px; }
        .course-title { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
        .course-desc { font-size: 13px; color: #afafaf; line-height: 1.35; }

        .path-header { background: #58cc02; color: #fff; padding: 16px; border-radius: 16px; margin-bottom: 24px; box-shadow: 0 4px 0 #46a302; }
        .path-header.vip-hdr { background: #ffc800; color: #131f24; box-shadow: 0 4px 0 #d9a600; }
        .path-container { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 10px 0 30px; }
        .node-wrap { display: flex; flex-direction: column; align-items: center; position: relative; }
        .node-btn { width: 74px; height: 70px; border-radius: 50%; border: none; font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
        .node-btn.done { background: #ffc800; color: #131f24; box-shadow: 0 6px 0 #c99c00; }
        .node-btn.current { background: #58cc02; color: #fff; box-shadow: 0 6px 0 #46a302; animation: pulse 1.6s infinite; }
        .node-btn.locked-node { background: #263740; color: #5a6d77; box-shadow: 0 6px 0 #1b282f; }
        .node-label { margin-top: 8px; font-size: 13px; font-weight: 800; color: #e5e5e5; background: #1f2f37; padding: 4px 10px; border-radius: 10px; border: 1px solid #37464f; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }

        .lesson-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
        .prog-bg { flex: 1; height: 14px; background: #263740; border-radius: 10px; overflow: hidden; }
        .prog-fill { height: 100%; width: 0%; background: #58cc02; transition: width 0.3s; border-radius: 10px; }

        .q-type { font-size: 12px; color: #1cb0f6; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .q-box { background: #1f2f37; border: 2px solid #37464f; border-radius: 16px; padding: 16px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; line-height: 1.35; }
        .audio-btn { background: #1cb0f6; border: none; border-radius: 12px; width: 44px; height: 44px; font-size: 20px; color: #fff; flex-shrink: 0; box-shadow: 0 3px 0 #1899d6; }
        .opt-btn { width: 100%; background: #1f2f37; color: #fff; border: 2px solid #37464f; border-bottom-width: 5px; border-radius: 14px; padding: 14px 16px; font-size: 16px; font-weight: 700; text-align: left; margin-bottom: 10px; display: block; }
        .opt-btn.correct { background: #1e3b17; border-color: #58cc02; color: #58cc02; }
        .opt-btn.wrong { background: #3b1717; border-color: #ff4b4b; color: #ff4b4b; }

        .build-area { min-height: 56px; border-bottom: 2px solid #37464f; padding: 8px 4px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
        .word-bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .word-chip { background: #1f2f37; color: #fff; border: 2px solid #37464f; border-bottom-width: 4px; border-radius: 12px; padding: 10px 14px; font-size: 16px; font-weight: 700; }
        .word-chip.used { opacity: 0.25; pointer-events: none; }

        .back-btn { background: none; border: none; color: #afafaf; font-weight: 800; font-size: 18px; }
        .btn-green { width: 100%; padding: 15px; background: #58cc02; color: #fff; border: none; border-bottom: 4px solid #46a302; border-radius: 14px; font-weight: 800; font-size: 16px; margin-top: 8px; text-transform: uppercase; }
        .btn-gold { width: 100%; padding: 15px; background: #ffc800; color: #131f24; border: none; border-bottom: 4px solid #d9a600; border-radius: 14px; font-weight: 800; font-size: 16px; margin-top: 10px; text-transform: uppercase; }

        .shop-card { background: #1f2f37; border: 2px solid #37464f; border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .buy-btn { background: #ffc800; color: #000; border: none; border-radius: 10px; padding: 10px 14px; font-weight: 800; white-space: nowrap; }

        .nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #131f24; border-top: 2px solid #37464f; display: flex; justify-content: space-around; align-items: center; z-index: 50; }
        .nav-item { background: none; border: none; color: #afafaf; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .nav-item.active { color: #1cb0f6; }
    </style>
</head>
<body>

    <div class="header">
        <div><span class="badge-lvl" id="user-lvl">A1</span></div>
        <div style="color:#ff9600">🔥 <span id="streak">1</span></div>
        <div style="color:#ffc800">⚡ <span id="xp">0</span> XP</div>
        <div style="color:#ff4b4b">❤️ <span id="hp">5</span></div>
    </div>

    <div class="content">
        <div id="t-test" class="tab">
            <div style="color:#1cb0f6;font-size:13px;font-weight:800;margin-bottom:6px;">🎯 ТЕСТ НА УРОВЕНЬ (<span id="test-step">1/5</span>)</div>
            <h2 style="font-size:19px;margin-bottom:14px;">Ответь на 5 вопросов, чтобы мы открыли твой уровень:</h2>
            <div class="q-box"><div id="test-q">Загрузка...</div></div>
            <div id="test-opts"></div>
        </div>

        <div id="t-courses" class="tab">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
                <h2 style="font-size:20px;">📚 Все курсы (A1–C1)</h2>
                <button type="button" onclick="startPlacementTest()" style="background:#1f2f37;border:1px solid #37464f;color:#1cb0f6;padding:6px 10px;border-radius:10px;font-size:12px;font-weight:700;">Пройти тест</button>
            </div>
            <div id="courses-list"></div>
        </div>

        <div id="t-path" class="tab">
            <button type="button" onclick="openCoursesMenu()" style="background:none;border:none;color:#1cb0f6;font-weight:800;font-size:15px;margin-bottom:12px;">⬅️ Все курсы</button>
            <div class="path-header" id="path-hdr">
                <div style="font-size:12px;font-weight:800;opacity:0.9;" id="path-lvl">УРОВЕНЬ A1</div>
                <div style="font-size:19px;font-weight:800;" id="path-title">Название курса</div>
            </div>
            <div class="path-container" id="path-nodes"></div>
        </div>

        <div id="t-lesson" class="tab">
            <div class="lesson-top">
                <button type="button" class="back-btn" onclick="backToPath()">✕</button>
                <div class="prog-bg"><div class="prog-fill" id="lesson-prog"></div></div>
            </div>
            <div class="q-type" id="q-type-lbl">ПЕРЕВЕДИ ФРАЗУ</div>
            <div class="q-box">
                <div id="q-txt">Вопрос</div>
                <button type="button" class="audio-btn" onclick="say()">🔊</button>
            </div>
            
            <div id="btns"></div>

            <div id="build-box" style="display:none;">
                <div class="build-area" id="build-selected"></div>
                <div class="word-bank" id="build-bank"></div>
                <button type="button" class="btn-green" id="check-build-btn" onclick="checkBuiltSentence()">ПРОВЕРИТЬ</button>
            </div>

            <div id="fb-msg" style="font-weight:800;font-size:16px;margin-top:10px;"></div>
            <button type="button" id="next-btn" class="btn-green" onclick="nxt()" style="display:none;">ДАЛЬШЕ ➡️</button>
        </div>

        <div id="t-rank" class="tab">
            <h2 style="margin-bottom:15px;">🏆 Золотая лига</h2>
            <div class="shop-card"><span>🥇 Alex_Pro (B2)</span><b>1240 XP</b></div>
            <div class="shop-card"><span>🥈 Maria_Eng (B1)</span><b>890 XP</b></div>
            <div class="shop-card"><span>🥉 Max_Dev (A2)</span><b>540 XP</b></div>
