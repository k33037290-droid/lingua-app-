<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LinguaPro Dark</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg-color: #131f24;
      --surface-color: #202f36;
      --border-color: #37464f;
      --text-main: #ffffff;
      --text-muted: #afafaf;
      --duo-green: #58cc02;
      --duo-green-shadow: #58a700;
      --duo-blue: #1cb0f6;
      --duo-blue-shadow: #1899d6;
      --duo-purple: #ce82ff;
      --duo-purple-shadow: #a55eea;
      --duo-locked: #37464f;
      --duo-locked-shadow: #2b3840;
      --duo-gold: #ffc800;
      --duo-gold-shadow: #e5a500;
      --duo-red: #ff4b4b;
      --duo-red-shadow: #ea2b2b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 90px;
      overflow-x: hidden;
      user-select: none;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-color);
      border-bottom: 2px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .course-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-color);
      border: 2px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    .stats {
      display: flex;
      gap: 14px;
      font-weight: 800;
      font-size: 15px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .unit-banner {
      margin: 16px;
      background-color: var(--duo-green);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 4px 0 var(--duo-green-shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .unit-banner.blue {
      background-color: var(--duo-blue);
      box-shadow: 0 4px 0 var(--duo-blue-shadow);
    }

    .unit-subtitle {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 800;
      opacity: 0.9;
      letter-spacing: 0.6px;
    }

    .unit-title {
      font-size: 18px;
      font-weight: 800;
      margin-top: 3px;
    }

    .guide-btn {
      background: rgba(0, 0, 0, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      padding: 8px 10px;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .path-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0 40px;
      position: relative;
    }

    .node-wrapper {
      position: relative;
      margin: 16px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .active-ring {
      position: absolute;
      width: 90px;
      height: 84px;
      border-radius: 50%;
      border: 5px solid var(--border-color);
      border-top-color: var(--duo-green);
      border-right-color: var(--duo-green);
      pointer-events: none;
    }

    .lesson-btn {
      width: 72px;
      height: 65px;
      border-radius: 50%;
      border: none;
      background-color: var(--duo-green);
      box-shadow: 0 6px 0 var(--duo-green-shadow);
      color: white;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .lesson-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--duo-green-shadow);
    }

    .lesson-btn.completed {
      background-color: var(--duo-gold);
      box-shadow: 0 6px 0 var(--duo-gold-shadow);
    }

    .lesson-btn.locked {
      background-color: var(--duo-locked);
      box-shadow: 0 6px 0 var(--duo-locked-shadow);
      color: #6b7d87;
      cursor: not-allowed;
    }

    .lesson-btn.locked:active {
      transform: none;
      box-shadow: 0 6px 0 var(--duo-locked-shadow);
    }

    .start-tooltip {
      position: absolute;
      top: -44px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--surface-color);
      border: 2px solid var(--border-color);
      color: var(--duo-green);
      font-weight: 800;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 12px;
      white-space: nowrap;
      animation: bounce 1.4s infinite ease-in-out;
      z-index: 10;
    }

    .start-tooltip::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 10px;
      height: 10px;
      background-color: var(--surface-color);
      border-right: 2px solid var(--border-color);
      border-bottom: 2px solid var(--border-color);
    }

    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -6px); }
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background-color: var(--bg-color);
      border-top: 2px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 90;
    }

    .nav-item {
      font-size: 24px;
      padding: 8px 18px;
      border-radius: 12px;
      border: 2px solid transparent;
      cursor: pointer;
      opacity: 0.65;
    }

    .nav-item.active {
      opacity: 1;
      background-color: rgba(28, 176, 246, 0.15);
      border-color: var(--duo-blue);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-sheet {
      background: var(--bg-color);
      border-top: 2px solid var(--border-color);
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 500px;
      padding: 24px 20px 32px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 16px;
      text-align: center;
    }

    .course-option, .quiz-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      margin-bottom: 10px;
      background: var(--surface-color);
      border: 2px solid var(--border-color);
      box-shadow: 0 3px 0 var(--border-color);
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 16px;
    }

    .course-option.selected, .quiz-option.selected {
      border-color: var(--duo-blue);
      box-shadow: 0 3px 0 var(--duo-blue-shadow);
      background: rgba(28, 176, 246, 0.15);
    }

    .quiz-option.wrong {
      border-color: var(--duo-red);
      box-shadow: 0 3px 0 var(--duo-red-shadow);
      background: rgba(255, 75, 75, 0.15);
    }

    .action-btn {
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border: none;
      border-radius: 14px;
      background: var(--duo-green);
      box-shadow: 0 4px 0 var(--duo-green-shadow);
      color: white;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
    }

    .action-btn:disabled {
      background: var(--duo-locked);
      box-shadow: 0 4px 0 var(--duo-locked-shadow);
      color: #6b7d87;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="course-selector" id="course-btn">
      <span id="current-course-icon">🐍</span>
      <span id="current-course-name">Python</span>
      <span style="font-size: 11px; opacity: 0.8;">▼</span>
    </div>
    <div class="stats">
      <div class="stat-item">🔥 <span id="streak-count">3</span></div>
      <div class="stat-item">💎 <span id="gems-count">120</span></div>
      <div class="stat-item">❤️ <span id="hearts-count">5</span></div>
    </div>
  </div>

  <div class="unit-banner" id="unit-banner">
    <div>
      <div class="unit-subtitle" id="unit-subtitle">Раздел 1</div>
      <div class="unit-title" id="unit-title">Переменные и вывод данных</div>
    </div>
    <button class="guide-btn" id="guide-btn">📖</button>
  </div>

  <div class="path-container" id="path-container"></div>

  <div class="bottom-nav">
    <div class="nav-item active" id="nav-learn">🏠</div>
    <div class="nav-item" id="nav-league">🏆</div>
    <div class="nav-item" id="nav-profile">👤</div>
  </div>

  <div class="modal-overlay" id="course-modal">
    <div class="modal-sheet">
      <div class="modal-title">Выберите курс</div>
      <div id="course-list"></div>
    </div>
  </div>

  <div class="modal-overlay" id="lesson-modal">
    <div class="modal-sheet">
      <div class="modal-title" id="lesson-modal-title">Задание</div>
      <p style="color: var(--text-muted); margin-bottom: 16px; font-size: 16px; line-height: 1.4;" id="lesson-question"></p>
      <div id="quiz-options"></div>
      <button class="action-btn" id="check-answer-btn" disabled>Проверить</button>
    </div>
  </div>

  <script>

      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      } catch (e) {}

      const courses = {
        python: {
          name: "Python",
          icon: "🐍",
          bannerColor: "",
          unitSubtitle: "Раздел 1 • Модуль 1",
