<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LinguaPro</title>
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #131f24; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        .header { display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 2px solid #37464f; font-weight: bold; }
        .content { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 85px; }
        .tab { display: none; }
        .tab.active { display: block; }
        .q-box { background: #1f2f37; border: 2px solid #37464f; border-radius: 16px; padding: 20px; margin: 15px 0 25px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: bold; }
        .audio-btn { background: #1cb0f6; border: none; border-radius: 12px; width: 45px; height: 45px; font-size: 20px; color: #fff; }
        .opt-btn { width: 100%; background: #1f2f37; color: #fff; border: 2px solid #37464f; border-bottom-width: 5px; border-radius: 14px; padding: 16px; font-size: 17px; font-weight: bold; text-align: left; margin-bottom: 12px; display: block; }
        .opt-btn.correct { background: #1e3b17; border-color: #58cc02; color: #58cc02; }
        .opt-btn.wrong { background: #3b1717; border-color: #ff4b4b; color: #ff4b4b; }
        .shop-card { background: #1f2f37; border: 2px solid #37464f; border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .buy-btn { background: #ffc800; color: #000; border: none; border-radius: 10px; padding: 10px 14px; font-weight: bold; }
        .nav { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #131f24; border-top: 2px solid #37464f; display: flex; justify-content: space-around; align-items: center; z-index: 50; }
        .nav-item { background: none; border: none; color: #afafaf; font-size: 12px; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .nav-item.active { color: #1cb0f6; }
    </style>
</head>
<body>
    <div class="header">
        <div style="color:#ff9600">🔥 1</div>
        <div style="color:#ffc800">⚡ <span id="xp">0</span> XP</div>
        <div style="color:#ff4b4b">❤️ <span id="hp">3</span></div>
    </div>

    <div class="content">
        <div id="t-learn" class="tab active">
            <div style="color:#afafaf;font-size:13px;font-weight:bold;">УРОВЕНЬ 1 • БАЗА</div>
            <div class="q-box">
                <div id="q-txt">Как переводится 'Apple'?</div>
                <button type="button" class="audio-btn" onclick="say()">🔊</button>
            </div>
            <div id="btns">
                <button type="button" class="opt-btn" onclick="ans(0, this)">Яблоко</button>
                <button type="button" class="opt-btn" onclick="ans(1, this)">Груша</button>
                <button type="button" class="opt-btn" onclick="ans(2, this)">Банан</button>
                <button type="button" class="opt-btn" onclick="ans(3, this)">Апельсин</button>
            </div>
            <button type="button" id="next-btn" onclick="nxt()" style="display:none;width:100%;padding:15px;background:#58cc02;color:#fff;border:none;border-radius:14px;font-weight:bold;font-size:17px;margin-top:10px;">ДАЛЬШЕ ➡️</button>
        </div>

        <div id="t-rank" class="tab">
            <h2 style="margin-bottom:15px;">🏆 Лига</h2>
            <div class="shop-card"><span>🥇 Alex_Pro</span><b>420 XP</b></div>
            <div class="shop-card"><span>🥈 Maria_Eng</span><b>310 XP</b></div>
            <div class="shop-card" style="border-color:#1cb0f6"><span>👤 Ты</span><b id="my-xp">0 XP</b></div>
        </div>

        <div id="t-shop" class="tab">
            <h2 style="margin-bottom:15px;">🛒 Магазин</h2>
            <div class="shop-card">
                <div><b>👑 VIP (30 дн.)</b><br><small style="color:#afafaf">Безлимит жизней</small></div>
                <button type="button" class="buy-btn" onclick="buy('vip')">50 ⭐️</button>
            </div>
            <div class="shop-card">
                <div><b>❄️ Заморозка</b><br><small style="color:#afafaf">Защита стрика</small></div>
                <button type="button" class="buy-btn" onclick="buy('freeze')">15 ⭐️</button>
            </div>
        </div>
    </div>

    <div class="nav">
        <button type="button" class="nav-item active" onclick="tab('learn', this)"><span style="font-size:20px">🦉</span>Учиться</button>
        <button type="button" class="nav-item" onclick="tab('rank', this)"><span style="font-size:20px">🏆</span>Лига</button>
        <button type="button" class="nav-item" onclick="tab('shop', this)"><span style="font-size:20px">🛒</span>Магазин</button>
    </div>

    <script>
        var tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.expand(); }

        var qs = [
            { q: "Как переводится 'Apple'?", s: "Apple", o: ["Яблоко", "Груша", "Банан", "Апельсин"], a: 0 },
            { q: "Переведи: 'I am a programmer'", s: "I am a programmer", o: ["Я учитель", "Я программист", "Он врач", "Мы студенты"], a: 1 },
            { q: "Переведи: 'She works from home'", s: "She works from home", o: ["Она дома", "Она работает из дома", "У нее дом", "Строит дом"], a: 1 },
            { q: "Что означает 'Success'?", s: "Success", o: ["Удача", "Успех", "Работа", "Деньги"], a: 1 }
        ];

        var idx = 0, xp = 0, hp = 3, isVip = false;

        function ans(i, el) {
            var bs = document.querySelectorAll('.opt-btn');
            for (var k = 0; k < bs.length; k++) { bs[k].disabled = true; }
            if (i === qs[idx].a) {
                el.classList.add('correct');
                xp += 10;
            } else {
                el.classList.add('wrong');
                bs[qs[idx].a].classList.add('correct');
                if (!isVip) { hp = Math.max(0, hp - 1); }
            }
            document.getElementById('xp').innerText = xp;
            document.getElementById('my-xp').innerText = xp + ' XP';
            document.getElementById('hp').innerText = isVip ? '♾️' : hp;
            document.getElementById('next-btn').style.display = 'block';
        }

        function nxt() {
            idx = (idx + 1) % qs.length;
            document.getElementById('q-txt').innerText = qs[idx].q;
            document.getElementById('next-btn').style.display = 'none';
            var b = document.getElementById('btns');
            b.innerHTML = '';
            for (var i = 0; i < qs[idx].o.length; i++) {
                (function(x) {
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'opt-btn';
                    btn.innerText = qs[idx].o[x];
                    btn.onclick = function() { ans(x, btn); };
                    b.appendChild(btn);
                })(i);
            }
        }

        function say() {
            if ('speechSynthesis' in window) {
                var u = new SpeechSynthesisUtterance(qs[idx].s);
                u.lang = 'en-US';
                speechSynthesis.speak(u);
            }
        }

        function tab(t, el) {
            var ts = document.querySelectorAll('.tab');
            for (var i = 0; i < ts.length; i++) { ts[i].classList.remove('active'); }
            var ns = document.querySelectorAll('.nav-item');
            for (var i = 0; i < ns.length; i++) { ns[i].classList.remove('active'); }
            document.getElementById('t-' + t).classList.add('active');
            el.classList.add('active');
        }

        function buy(item) {
            var links = {
                vip: "https://" + "t.me/$ElaWUcXSCEjkFgAANpAt_vj4fGQ",
                freeze: "https://" + "t.me/$_nXN6cXSCEjlFgAApjf9EBrY0v4"
            };
            var url = links[item];
            if (tg && tg.openInvoice) {
                tg.openInvoice(url, function(status) {
                    if (status === "paid") {
                        if (item === "vip") {
                            isVip = true;
                            document.getElementById('hp').innerText = '♾️';
                        }
                        alert("🎉 Оплата прошла успешно! Бонус активирован!");
                    }
                });
            } else {
                window.open(url, "_blank");
            }
        }
    </script>
</body>
</html>
