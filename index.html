<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DuoClone Dark</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg-color: #131f24;
      --surface-color: #202f36;
      --border-color: #37464f;
      --text-main: #ffffff;
      --text-muted: #afafaf;
      --duo-green: #58cc02;
      --duo-green-shadow: #58a700;
      --duo-blue: #1cb0f6;
      --duo-blue-shadow: #1899d6;
      --duo-locked: #37464f;
      --duo-locked-shadow: #2b3840;
      --duo-gold: #ffc800;
      --duo-gold-shadow: #e5a500;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 80px;
      overflow-x: hidden;
    }

    /* Верхняя панель (Выбор курса и статистика) */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-color);
      border-bottom: 2px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .course-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-color);
      border: 2px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .stats {
      display: flex;
      gap: 14px;
      font-weight: 700;
      font-size: 15px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Баннер текущего раздела */
    .unit-banner {
      margin: 16px;
      background-color: var(--duo-green);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 4px 0 var(--duo-green-shadow);
    }

    .unit-banner.blue {
      background-color: var(--duo-blue);
      box-shadow: 0 4px 0 var(--duo-blue-shadow);
    }

    .unit-subtitle {
      font-size: 13px;
      text-transform: uppercase;
      font-weight: 800;
      opacity: 0.85;
      letter-spacing: 0.5px;
    }

    .unit-title {
      font-size: 19px;
      font-weight: 800;
      margin-top: 4px;
    }

    /* Извилистая дорожка */
    .path-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 40px;
      position: relative;
    }

    .node-wrapper {
      position: relative;
      margin: 14px 0;
      transition: transform 0.2s;
    }

    /* Кнопка-уровень в стиле Duolingo */
    .lesson-btn {
      width: 72px;
      height: 66px;
      border-radius: 50%;
      border: none;
      background-color: var(--duo-green);
      box-shadow: 0 6px 0 var(--duo-green-shadow);
      color: white;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .lesson-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--duo-green-shadow);
    }

    .lesson-btn.completed {
      background-color: var(--duo-gold);
      box-shadow: 0 6px 0 var(--duo-gold-shadow);
    }

    .lesson-btn.locked {
      background-color: var(--duo-locked);
      box-shadow: 0 6px 0 var(--duo-locked-shadow);
      color: #6b7d87;
      cursor: not-allowed;
    }

    .lesson-btn.locked:active {
      transform: none;
      box-shadow: 0 6px 0 var(--duo-locked-shadow);
    }

    /* Подсказка "НАЧАТЬ" над активным уроком */
    .start-tooltip {
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--surface-color);
      border: 2px solid var(--border-color);
      color: var(--duo-green);
      font-weight: 800;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 10px;
      white-space: nowrap;
      animation: bounce 1.5s infinite;
    }

    .start-tooltip::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 10px;
      height: 10px;
      background-color: var(--surface-color);
      border-right: 2px solid var(--border-color);
      border-bottom: 2px solid var(--border-color);
    }

    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -5px); }
    }

    /* Модальное окно выбора курса и задания */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-sheet {
      background: var(--bg-color);
      border-top: 2px solid var(--border-color);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 500px;
      padding: 24px 20px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 16px;
      text-align: center;
    }

    .course-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      margin-bottom: 10px;
      background: var(--surface-color);
      border: 2px solid var(--border-color);
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .course-option.selected {
      border-color: var(--duo-blue);
      background: rgba(28, 176, 246, 0.12);
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 14px;
      background: var(--duo-green);
      box-shadow: 0 4px 0 var(--duo-green-shadow);
      color: white;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Верхняя панель -->
  <div class="top-bar">
    <div class="course-selector" onclick="openCourseModal()">
      <span id="current-course-icon">🐍</span>
      <span id="current-course-name">Python</span>
      <span>▼</span>
    </div>
    <div class="stats">
      <div class="stat-item">🔥 <span id="streak-count">3</span></div>
      <div class="stat-item">💎 <span id="gems-count">120</span></div>
    </div>
  </div>

  <!-- Баннер раздела -->
  <div class="unit-banner" id="unit-banner">
    <div class="unit-subtitle" id="unit-subtitle">Раздел 1</div>
    <div class="unit-title" id="unit-title">Основы синтаксиса</div>
  </div>

  <!-- Извилистая дорожка уровней -->
  <div class="path-container" id="path-container"></div>

  <!-- Модальное окно выбора курса -->
  <div class="modal-overlay" id="course-modal" onclick="closeModals(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-title">Выберите курс</div>
      <div id="course-list"></div>
    </div>
  </div>

  <!-- Модальное окно урока -->
  <div class="modal-overlay" id="lesson-modal" onclick="closeModals(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-title" id="lesson-modal-title">Урок 1</div>
      <p style="color: var(--text-muted); text-align: center; margin-bottom: 16px;" id="lesson-modal-desc">
        Пройдите задание, чтобы открыть следующий узел на карте.
      </p>
      <button class="action-btn" onclick="completeCurrentLesson()">Завершить урок (+10 💎)</button>
    </div>
  </div>

  <script>
    // Инициализация Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Данные курсов и уроков
    const courses = {
      python: {
        name: "Python",
        icon: "🐍",
        bannerColor: "",
        unitSubtitle: "Раздел 1",
        unitTitle: "Переменные и циклы",
        lessons: [
          { id: 1, title: "Вывод текста (print)", icon: "⭐", status: "completed" },
          { id: 2, title: "Переменные и типы", icon: "📘", status: "active" },
          { id: 3, title: "Условия if / else", icon: "⚡", status: "locked" },
          { id: 4, title: "Сундук с наградой", icon: "🎁", status: "locked" },
          { id: 5, title: "Циклы for и while", icon: "🔥", status: "locked" },
          { id: 6, title: "Финальный босс", icon: "🏆", status: "locked" }
        ]
      },
      english: {
        name: "English",
        icon: "🇬🇧",
        bannerColor: "blue",
        unitSubtitle: "Unit 1",
        unitTitle: "Базовые фразы и приветствия",
        lessons: [
          { id: 1, title: "Hello & Goodbye", icon: "⭐", status: "active" },
          { id: 2, title: "Глагол to be", icon: "📘", status: "locked" },
          { id: 3, title: "Заказ кофе", icon: "☕", status: "locked" },
          { id: 4, title: "Повторение", icon: "🏆", status: "locked" }
        ]
      }
    };

    let currentCourseKey = "python";
    let selectedLessonIndex = null;
    let gems = 120;

    // Отрисовка извилистой дорожки (синусоидальное смещение)
    function renderPath() {
      const course = courses[currentCourseKey];
      const container = document.getElementById("path-container");
      container.innerHTML = "";

      document.getElementById("current-course-icon").textContent = course.icon;
      document.getElementById("current-course-name").textContent = course.name;
      document.getElementById("unit-subtitle").textContent = course.unitSubtitle;
      document.getElementById("unit-title").textContent = course.unitTitle;

      const banner = document.getElementById("unit-banner");
      banner.className = "unit-banner " + course.bannerColor;
